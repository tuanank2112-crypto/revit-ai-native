name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Creating a GitHub release requires write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build Core (net48 + net8.0)
      run: dotnet build libs/agent-core/AutodeskNativeAgent.Core.csproj -c Release

    - name: Build Tests
      run: dotnet build tests/unit/AutodeskNativeAgent.Core.Tests/AutodeskNativeAgent.Core.Tests.csproj -c Release

    - name: Run Tests
      run: dotnet test tests/unit/AutodeskNativeAgent.Core.Tests/AutodeskNativeAgent.Core.Tests.csproj -c Release --no-build --verbosity normal

    - name: Build MCP server
      run: |
        cd apps/agent-mcp
        npm ci
        npm run build

    - name: Create release package (MCP + core + docs, Revit add-in excluded — needs Revit DLLs)
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^v',''
        $stage = "$env:RUNNER_TEMP\release-staging"
        New-Item -ItemType Directory -Path $stage -Force | Out-Null

        # Core DLL
        Copy-Item "libs\agent-core\bin\Release\net8.0\AutodeskNativeAgent.Core.dll" $stage

        # MCP server
        Copy-Item "apps\agent-mcp\dist" "$stage\dist" -Recurse
        Copy-Item "apps\agent-mcp\package.json" $stage
        Copy-Item "apps\agent-mcp\tsconfig.json" $stage

        # Pack the Core library NuGet package
        dotnet pack "libs\agent-core\AutodeskNativeAgent.Core.csproj" -c Release -o "$env:RUNNER_TEMP\nupkg"
        Copy-Item "$env:RUNNER_TEMP\nupkg\*.nupkg" $stage

        # Scripts
        Copy-Item "scripts\*.ps1" $stage

        # Samples + docs
        Copy-Item "samples\plans" "$stage\samples\plans" -Recurse
        Copy-Item "README.md" $stage

        Compress-Archive -Path "$stage\*" -DestinationPath "$env:RUNNER_TEMP\AutodeskNativeAgent-$version.zip"
        Write-Output "ZIP_READY=$env:RUNNER_TEMP\AutodeskNativeAgent-$version.zip"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ runner.temp }}/AutodeskNativeAgent-*.zip
          ${{ runner.temp }}/nupkg/*.nupkg
        generate_release_notes: true
