name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # The add-in project requires RevitAPI.dll which is NOT available on CI runners.
    # Build the shared core (net48 + net8.0) and the test project instead; the add-in
    # is compiled/verified locally on machines with Revit 2024 installed.
    - name: Build Core (net48 + net8.0)
      run: dotnet build libs/agent-core/AutodeskNativeAgent.Core.csproj -c Release

    - name: Build Tests
      run: dotnet build tests/unit/AutodeskNativeAgent.Core.Tests/AutodeskNativeAgent.Core.Tests.csproj -c Release

    - name: Run Unit + Integration Tests
      run: dotnet test tests/unit/AutodeskNativeAgent.Core.Tests/AutodeskNativeAgent.Core.Tests.csproj -c Release --no-build --verbosity normal

    - name: Install MCP dependencies
      run: |
        cd apps/agent-mcp
        npm ci

    - name: Build MCP server (tsc)
      run: |
        cd apps/agent-mcp
        npm run build
